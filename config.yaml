# ALL tunable numbers live here (no magic numbers in code).
# Every weight / threshold below is a PLACEHOLDER until it is checked against the human
# survey (scripts/09_analyze_survey.py, scripts/10_fit_weights.py). Never report them as tuned.
# Paths are relative to the project root, with forward slashes.

seed: 42

paths:
  dataset_dir: dataset                      # EmoArt-5k, NOT in git, never modified
  images_dir: dataset/Images
  annotation_file: dataset/annotation.json
  extract_log: dataset/extract_log.csv      # written by extract_emoart.py (renamed files)
  catalog: data/catalog.csv                 # generated by scripts/02_build_catalog.py
  rooms_dir: data/rooms                     # hand-picked test room photos
  color_words: data/color_words.yaml
  emotion_lexicon: data/emotion_lexicon.yaml
  emotion_paraphrases: data/emotion_paraphrases.yaml
  embeddings_dir: embeddings                # cached CLIP embeddings + palettes, NOT in git
  results_dir: results                      # every metric, table and figure
  artwork_sizes: data/artwork_sizes.csv     # OPTIONAL real sizes (image_path,width_cm,height_cm) for
                                            # "See it on my wall"; missing = the user types the size

# Key paths inside one entry of annotation.json, read from the real file with
# scripts/01_inspect_dataset.py (not from memory). Changing the annotation file only
# means editing this block.
annotation_fields:
  image_path: [image_path]
  request_id: [request_id]
  dominant_emotion: [description, third_section, dominant_emotion]
  valence: [description, third_section, emotional_valence]
  arousal: [description, third_section, emotional_arousal_level]
  healing_effects: [description, third_section, healing_effects]

clip:
  # The 336 px version of ViT-L/14 with OpenAI's weights.
  model: ViT-L-14-336
  pretrained: openai
  # Tried in this order by scripts/03_benchmark_clip.py if the model above runs out of VRAM.
  fallback_models: [ViT-L-14, ViT-B-16, ViT-B-32]
  batch_size: 32
  num_workers: 0          # Windows: start at 0; try 2-4 later and keep only if faster and stable
  chunk_size: 512         # rows per resumable checkpoint in embeddings/partial/
  image_draft_px: 512     # JPEG draft decode size; above CLIP's 336 px input, much faster on big files
  benchmark_images: 50

color:
  k: 5                    # k-means clusters per palette
  downsample_px: 192      # longest side before k-means
  min_coverage: 0.05      # clusters smaller than this share of pixels are dropped
  neutral_sat: 0.12       # HSV saturation below this -> neutral (grey/white), hue meaningless
  neutral_val: 0.15       # HSV value below this -> neutral (near black)
  white_balance: false    # gray-world correction; an ablation, not the baseline
  ideal_angles: [0, 30, 120, 150, 180]   # monochromatic, analogous, triadic, split-compl., complementary
  sigma: 15               # degrees, width of each ideal-angle bump
  plateau: 0.3            # sat/val difference that still scores 1.0
  floor: 0.2              # sat/val score at the largest possible difference (1.0)
  w_hue: 0.4
  w_sat: 0.3
  w_val: 0.3
  neutral_hue_score: 0.8  # hue term used when either colour is neutral
  aggregation: weighted_mean   # weighted_mean | best_pair
  # What a colour from the user (picker or text) does. Chosen on 2026-10-22: two_step.
  # override and blend are kept as ablations.
  #   two_step: the first color_first_n picks must contain the user's colour (or a shade of it),
  #             ranked among themselves by the normal score; everything after that is the normal
  #             ranking. The colour score itself stays "harmony with the room".
  #   override: the user's colour REPLACES the room palette as the harmony reference
  #   blend:    harmony with the room, mixed with "contains the user's colour"
  # No user colour -> all three modes are identical (harmony with the room).
  color_reference_mode: two_step
  color_first_n: 5                # two_step: this many top picks contain the user's colour
  color_first_match_weight: 0.5   # two_step: the colour picks are ordered 50% by how much of the colour
                                  # they contain, 50% by the normal score (description, mood, room)
  color_match_min_share: 0.20     # "contains" = at least this share of the artwork is that colour family;
                                  # if fewer than color_first_n artworks reach it, the closest ones are used
  color_match_hue_sigma: 10       # degrees: hues this close are the same colour family (at 15, orange
                                  # still counted as a shade of red; warm colour names are only ~20 deg apart)
  color_match_sat_sigma: 0.35     # wide on purpose: lighter/darker/duller shades still count, just less
  color_match_value_sigma: 0.35
  color_match_neutral_value_sigma: 0.15  # white/grey/black: how close the brightness must be
  color_near_hue_sigma: 30        # two_step fallback: "closest shade" when the exact colour isn't
                                  # there (e.g. orange or maroon for red), a wider hue tolerance
  blend_preference_share: 0.5     # blend mode only: share of the colour score given to the user's colour

text:
  text_mode: split        # split | blend  -- compared by experiment E3 (06_validate_emotion.py)
  emotion_templates:
    - "a painting that feels {}"
    - "an artwork with a {} mood"
    - "a {} painting"
  description_templates:
    - "a painting of {}"
    - "an artwork depicting {}"
  blend_templates:        # blend mode: the whole cleaned phrase ("calming forest") in one embedding
    - "a {} painting"
    - "{}"
  # Words that only say "this is a colour" and are removed together with the colour word
  # ("blue tones" -> both words go).
  color_trailing_words: [tone, tones, shade, shades, color, colors, colour, colours, hue, hues]
  # Words that carry no subject. Removed before the leftover text becomes the description.
  # ("on" and "no" are quoted: bare, YAML would read them as true/false.)
  stopwords: [a, an, the, and, or, but, of, in, "on", at, to, for, with, by, from, into, about, as,
              is, are, be, it, its, this, that, these, those, some, any, very, really, quite, more,
              most, so, too, just, i, me, my, we, our, you, your, want, wants, would, like, love,
              need, please, something, somewhat, kind, sort, type, feel, feels, feeling, feelings,
              mood, moods, vibe, vibes, atmosphere, painting, paintings, art, artwork, artworks,
              picture, pictures, piece, pieces, image, images, room, wall, look, looks, looking,
              make, makes, get, gets, have, has, which, what, there, not, "no", all, one]

# Content has priority whenever the text has a description: paintings that clearly show it come
# first ("sea" -> sea paintings, not abstracts, unless the user asks for "abstract"). With a colour
# too ("red sea"), the colour picks must also show the subject; if no subject painting has the
# colour, subject paintings in the closest shade are used.
subject:
  # "Clearly shows the subject" = (description similarity - similarity to a generic "a painting")
  # is at least min_z standard deviations above the catalog average. Subtracting the generic
  # similarity matters: some images (often flat abstracts) are close to almost any text in CLIP.
  generic_prompts: ["a painting", "an artwork", "a picture"]
  min_z: 2.5              # checked on the catalog: ~80-150 artworks per subject ("sea", "forest", "boats")
  min_pool: 20            # if fewer pass, the 20 most subject-like artworks are used instead
  order_weight: 0.5       # inside the subject paintings: 50% normal score, 50% how clearly they show the subject

scoring:
  normalization: minmax   # minmax | rank | none
  # Placeholders, NOT tuned. Changed on 2026-10-22 from the first design's 0.30 / 0.35 / 0.20 / 0.15:
  # most users give a description, and CLIP is strong at matching subjects/descriptions, so the
  # description got +0.20 (style and colour -0.10 each).
  weights:
    style: 0.20
    color: 0.25
    emotion: 0.20
    description: 0.35
  top_n: 15               # results shown (raised from 5; the ranking rules are unchanged)

# The "Save" button in the web app: one white image with the room photo(s) on top and the top
# recommendations below, in rank order. Nothing else on it (no text, no numbers).
save_sheet:
  n_artworks: 10
  width_px: 1500
  columns: 5
  padding_px: 24
  room_max_height_px: 700

# Emotion-only mode (app/emotion_app.py, main.py --emotion-only): the user types only an emotion.
# No room photo, no style, colour or description score: artworks are ranked by CLIP's emotion match
# alone. For the human check of CLIP's emotion matching.
emotion_only:
  top_n: 20               # paintings shown and saved per search
  columns: 4              # images per row on the page

# "See it on my wall" in the web app (src/artrec/wall_preview.py): a recommended artwork at its real
# size on the room photo, placed where the user clicks, with a shadow that follows the room's light.
# Display only: nothing here changes the recommendations or their scores.
wall_preview:
  camera_distance_ft: 6           # the photo is taken this far from the wall (editable on the page)
  default_focal_35mm: 26          # photo without EXIF focal length: a typical phone main camera
  room_max_px: 1600               # longest side of the room photo the artwork is placed on
  default_artwork_width_cm: 60    # starting width when the artwork's real size is unknown
  max_artwork_cm: 500             # largest width/height that can be typed in
  light_region: 3.0               # the light is judged on a patch this many artwork sizes around the spot
  light_grid_px: 32               # that patch is shrunk to this many pixels a side first
  wall_chroma_tol: 0.06           # wall pixels: chromaticity (r,g,b / sum) this close to the patch median...
  wall_lum_band: 0.5              # ...and brightness within +-50% of its median (keeps shading, drops furniture)
  light_contrast_full: 0.3        # relative brightness slope at which the light counts as fully directional
  # Pairs are [soft, even light ... strongly directional light], interpolated by light strength
  shadow_offset_in: [0.4, 1.2]    # how far the shadow is shifted from the artwork, inches
  shadow_blur_in: [1.0, 0.4]      # how soft its edge is, inches
  shadow_opacity: [0.35, 0.55]
  contact_shadow_scale: 0.25      # the tight shadow right at the edge: cast shadow offset/blur times this

validation:               # scripts/06_validate_emotion.py
  e1_recall_ks: [1, 2, 3, 5]
  retrieval_ks: [10, 20]
  e3_k: 20

survey:                   # scripts/07 - 09
  moods: [calming, joyful, melancholic]
  top_n: 5
  random_controls: 1
  mismatch_bottom_share: 0.10     # "mismatched" control = lowest colour score among the bottom 10% overall
  muted_room_max_saturation: 0.30 # room counts as muted below this mean saturation
  bold_min_saturation: 0.60       # artwork counts as "bold" above this mean saturation of its colours
  item_px: 360                    # size of each artwork in the survey images
  room_px: 900

fit_weights:              # scripts/10_fit_weights.py
  step: 0.05
  objective: spearman     # spearman | top3_mean
