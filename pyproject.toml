[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "artrec"
version = "0.1.0"
description = "Wall-aware art recommendation: pretrained CLIP + explainable colour, geometry and scoring logic"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
